title: Waterfalls
description: Interactive spectrograms of radio sources monitored by the EPIC imager at the Long Wavelength Array in Sevilleta, New Mexico.

navigation: false
hero:
  title: EPIC Waterfalls
  description: Spectral Analysis with Ion Thrusters
  icon: i-material-symbols-waterfall-chart
cards:
  - title: Spectrograms @LWA-SV
    description: Explore the live and archival spectrograms of transient sources.
    to: /waterfalls/spectrograms/lwasv
    #target: _self

  - title: FRB Events
    description: Dedispersed spectrograms and the dispersion measure search of every CHIME/FRB event watched at LWA-SV.
    to: /waterfalls/spectrograms/frb

  - title: Daily Digest
    description: Explore the long-integration spectrograms for all monitored sources.
    to: /waterfalls/spectrograms/dailydigest

  - title: All-sky monitor
    description: Real-time search of the whole visible sky for dispersed bursts in every imaging band, and the spectrogram of any position.
    to: /waterfalls/spectrograms/skymon
    admin: true

  - title: All-sky catalogue
    description: Every FRB event and giant pulse found by the all-sky monitor, with the data of each detection.
    to: /waterfalls/spectrograms/skymon-catalogue
    admin: true
